name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build arm64-v8a APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/botwrecompandroid/**/*.gradle*', 'android/botwrecompandroid/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install Android SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;30.0.16248370" "cmake;3.30.4" "platforms;android-30" "platforms;android-36"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core build-essential ninja-build

      - name: Restore deps cache
        uses: actions/cache/restore@v4
        with:
          path: android/deps/out
          key: deps-${{ hashFiles('android/deps/*.sh', 'android/deps/*.patch') }}

      - name: Build dependencies
        run: |
          export ANDROID_NDK_LINUX=$ANDROID_HOME/ndk/30.0.16248370
          export ANDROID_NDK=$ANDROID_HOME/ndk/30.0.16248370
          bash android/deps/build_ffmpeg.sh
          bash android/deps/build_deps.sh
          bash android/deps/build_gen_deps.sh

      - name: Save deps cache
        uses: actions/cache/save@v4
        if: success()
        with:
          path: android/deps/out
          key: deps-${{ hashFiles('android/deps/*.sh', 'android/deps/*.patch') }}

      - name: Clone libadrenotools
        run: |
          rm -rf third_party/libadrenotools
          git clone --recursive https://github.com/bylaws/libadrenotools third_party/libadrenotools

      - name: Build APK
        run: |
          cd android/botwrecompandroid
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: botwrecompandroid-arm64-v8a
          path: android/botwrecompandroid/app/build/outputs/apk/**/*.apk
